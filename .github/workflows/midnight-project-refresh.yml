name: Midnight project refresh

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: midnight-project-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg imagemagick libheif-examples

      - name: Install dependencies
        run: npm ci

      - name: Pull project submissions
        run: npm run sync

      - name: Verify the refreshed site
        run: npm run build

      - name: Publish refreshed project data
        shell: bash
        run: |
          current_year="$(node -p "JSON.parse(require('node:fs').readFileSync('src/site.config.json', 'utf8')).year")"
          git add "src/data/${current_year}.json" public/images
          if git diff --cached --quiet; then
            echo "No new or changed submissions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh project submissions"
          git push
